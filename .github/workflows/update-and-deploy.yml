name: Deploy site

# Podatke NE proizvodi vise ovaj workflow. `fetch_prices.py` je gradio cijene iz
# `decks/*.txt`, a tamo ih ima 12 — pa je svaki dnevni run pregazio puni izvoz
# (158 deckova) verzijom s 12 deckova i katalog je izgledao kao da je prazan.
#
# Od 2026-07-29 `data/` puni lokalni pipeline:
#   python scripts/mtg/update.py daily     # svjeze cijene u SQLite
#   python scripts/mtg/export.py --web     # -> scripts/mtg/data-web/ (povijest 180 dana)
#   kopiraj data-web/* u ovaj repo pod data/ pa commitaj
# Ovaj workflow samo objavljuje ono sto je commitano.

on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: update-and-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      # Publish to the gh-pages branch (pushing this branch auto-enables
      # GitHub Pages; the Actions token may not create a Pages site via API).
      - name: Deploy to gh-pages
        run: |
          rm -rf /tmp/pub && mkdir /tmp/pub
          cp -r site data index.html /tmp/pub/
          touch /tmp/pub/.nojekyll
          cd /tmp/pub
          # index.html, app.js i style.css keširaju se neovisno (Pages salje
          # max-age=600), pa posjetitelj s toplim cacheom moze dobiti novi HTML
          # uz stari JS - a to je prazna stranica, ne kozmeticki problem.
          # Verzija u query stringu veze ih uz isti commit.
          V="${GITHUB_SHA:0:8}"
          sed -i "s|src=\"app.js\"|src=\"app.js?v=$V\"|; s|href=\"style.css\"|href=\"style.css?v=$V\"|" \
            site/index.html
          grep -q "app.js?v=$V" site/index.html || { echo "::error::cache-bust nije primijenjen"; exit 1; }
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Deploy site $(date -u +%FT%TZ)"
          git push --force \
            "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" \
            gh-pages
