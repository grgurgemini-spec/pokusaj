<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1a1713">
<title>Precon Price Tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📈</text></svg>">
</head>
<body>
<header class="topbar">
  <a class="brand" href="#/">Precon<span>Tracker</span></a>
  <nav id="nav"></nav>
  <div class="price-toggle" id="price-toggle" role="group" aria-label="Cardmarket cijena"
    title="Cardmarket cijena: prosjek (trend) ili najjeftinija ponuda (from)">
    <span class="pt-lbl" aria-hidden="true">Cijena</span>
    <button data-mode="eur" class="on">Average</button><button data-mode="eur_low">From</button>
  </div>
  <span class="updated" id="updated"></span>
  <!-- Prikazuje se samo uz lokalni dashboard (dashboard.py /api/job); na GitHub
       Pagesu ga app.js sakrije jer tamo nema sto povuci. -->
  <button id="update-btn" class="update-btn" hidden
    title="Povuci svježe Cardmarket cijene">⟳ Update</button>
</header>
<main id="app">
  <div class="loading">Učitavam podatke…</div>
</main>
<footer class="foot"><span>
  Cijene: Cardmarket EUR (<em>trend</em> = Average, <em>from</em> = najjeftinija ponuda) i
  TCGplayer USD preko <a href="https://scryfall.com" target="_blank" rel="noopener">Scryfalla</a>;
  povijest od 2017. iz MTGStocksa. Prikazano je što se dogodilo — ništa ovdje nije prognoza.
  Nije povezano s Cardmarketom, MTGStocksom ni Wizards of the Coast.
</span></footer>
<script src="app.js"></script>
</body>
</html>
